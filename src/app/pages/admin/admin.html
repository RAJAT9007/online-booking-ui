<div class="admin-container">

    <!-- Fixed Sidebar -->
    <aside class="sidebar">
        <div>
            <!-- Branding -->
            <div class="sidebar-brand">
                <h2 class="text-gradient">Admin Panel</h2>
                <span class="admin-tag">MovieBooking</span>
            </div>

            <!-- Navigation Links -->
            <ul class="nav-list">
                <!-- Use routerLink for Angular SPA navigation without page reloads -->
                <!-- Use routerLinkActive to automatically apply the "active" CSS class -->
                <li routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item">
                    <i class="bi bi-speedometer2"></i> <span>Dashboard</span>
                </li>

                <li routerLink="/admin/city" routerLinkActive="active" class="nav-item">
                    <i class="bi bi-geo-alt"></i> <span>Manage Cities</span>
                </li>

                <li routerLink="/admin/theaters" routerLinkActive="active" class="nav-item">
                    <i class="bi bi-building-gear"></i> <span>Manage Theaters</span>
                </li>
            </ul>
        </div>

        <div class="sidebar-footer">
            <button class="logout-btn">Logout</button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="content-area">
        <div class="glass-container">
            <!-- ✅ The Child Components (City, Theatre) will load HERE! -->
            <router-outlet></router-outlet>
        </div>
    </main>

</div>
