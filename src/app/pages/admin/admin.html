<div class="admin-container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Admin Panel</h2>

        <button routerLink="/admin/dashboard" routerLinkActive="active" class="menu-btn">
            <i class="bi bi-speedometer2"></i> Dashboard
        </button>

        <button routerLink="/admin/city" routerLinkActive="active" class="menu-btn">
            <i class="bi bi-geo-alt"></i> Manage Cities
        </button>

        <button routerLink="/admin/theaters" routerLinkActive="active" class="menu-btn">
            <i class="bi bi-building-gear"></i> Manage Theaters
        </button>

        <button routerLink="/admin/movies" routerLinkActive="active" class="menu-btn">
            <i class="bi bi-film"></i> Manage Movies
        </button>

        <div class="sidebar-footer" style="margin-top: auto; padding-top: 20px;">
            <button (click)="logout()" class="logout-btn menu-btn"
                style="background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); justify-content: center; width: 100%;">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </div>

    <!-- Content Area -->
    <div class="content">
        <router-outlet></router-outlet>
    </div>

</div>
