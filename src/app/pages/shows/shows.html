<div class="admin-card">
    <div class="header">
        <div class="title-group">
            <h2 class="text-gradient">📅 Show Management</h2>
            <p class="subtitle">Assign and configure movie timings</p>
        </div>

        <button class="add-btn" (click)="openAddForm()">
            <i class="bi bi-plus-lg"></i> Add Show
        </button>
    </div>

    <div class="glass-form fade-in" *ngIf="showForm">
        <form (ngSubmit)="saveShow()" #showFormRef="ngForm">
            <h3 class="form-title">Schdedule New Show</h3>

            <div class="form-grid">
                <div class="form-group">
                    <label>Theater</label>
                    <select [(ngModel)]="selectedTheatreId" name="theatre" (change)="onTheatreChange()" required>
                        <option [ngValue]="null">Select Theater</option>
                        <option *ngFor="let t of theatres" [value]="t.id">{{ t.name }}</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Screen</label>
                    <select [(ngModel)]="selectedScreenId" name="screen" [disabled]="!selectedTheatreId" required>
                        <option [ngValue]="null">Select Screen</option>
                        <option *ngFor="let s of screens" [value]="s.id">{{ s.screenName }} (Seats: {{ s.totalSeats }})</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Movie</label>
                    <select [(ngModel)]="selectedMovieId" name="movie" required>
                        <option [ngValue]="null">Select Movie</option>
                        <option *ngFor="let m of movies" [value]="m.id">{{ m.title }}</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Language</label>
                    <select [(ngModel)]="newShow.language" name="language" required>
                        <option value="Hindi">Hindi</option>
                        <option value="English">English</option>
                        <option value="Telugu">Telugu</option>
                        <option value="Tamil">Tamil</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Start Time</label>
                    <input type="datetime-local" [(ngModel)]="newShow.startTime" name="startTime" required>
                </div>

                <div class="form-group">
                    <label>End Time</label>
                    <input type="datetime-local" [(ngModel)]="newShow.endTime" name="endTime" required>
                </div>
                
                <div class="form-group">
                    <label>Ticket Price (₹)</label>
                    <input type="number" [(ngModel)]="newShow.price" name="price" required>
                </div>

            </div>

            <div class="form-group full-width mt-3">
                <button class="save-btn" type="submit">Publish Show</button>
                <button class="cancel-btn" type="button" (click)="showForm=false">Cancel</button>
            </div>
        </form>
    </div>
</div>
