<div class="schedule-container">
    <h2>Tickets for {{ movieDetails?.title || 'Movie' }}</h2>

    <!-- Dynamic Theater Shows List -->
    <div class="theater-list">
        <div class="theater-card" *ngFor="let mapping of theatreShowsMapping">
            <div class="theater-header">
                <h4>{{ mapping.theatre.name }}</h4>
                <p class="theater-address">{{ mapping.theatre.address }}</p>
            </div>
            
            <div class="shows-wrapper">
                <div class="show-item" *ngFor="let show of mapping.shows">
                    <div class="show-info">
                        <span class="screen-name">{{ getScreenName(mapping, show.screenId) }}</span>
                        <span class="language-tag">{{ show.language }}</span>
                        <span class="price-tag">₹{{ show.price }}</span>
                    </div>
                    <button class="time-btn" (click)="goToSeatBooking(mapping.theatre, show)">
                        {{ formatTime(show.startTime) }}
                    </button>
                </div>
            </div>
        </div>

        <div *ngIf="theatreShowsMapping.length === 0" class="no-shows">
            <p>No shows available for this movie right now.</p>
        </div>
    </div>
</div>
