<div class="card">

    <h2>Create Theatre</h2>

    <!-- In your create theatre form -->
    <div class="form-group">
        <label>Owner ID</label>
        <input type="text" [(ngModel)]="theatre.ownerId" placeholder="Enter Owner ID" />
    </div>

    <label>Theatre Name</label>
    <input [(ngModel)]="theatre.name">

    <label>City Id</label>
    <input type="number" [(ngModel)]="theatre.cityId">

    <label>Address</label>
    <textarea [(ngModel)]="theatre.address"></textarea>

    <label>Status</label>
    <select [(ngModel)]="theatre.status">
        <option value="ACTIVE">Active</option>
        <option value="INACTIVE">Inactive</option>
    </select>

    <button (click)="createTheatre()">Create</button>

</div>
