<div class="profile-layout">
    <div class="profile-sidebar">
        <div class="avatar-circle">
            <i class="bi bi-briefcase-fill"></i>
        </div>
        <h2>Owner Hub</h2>
        <p class="role-badge">Theatre Partner</p>

        <div class="contact-info">
            <p><i class="bi bi-envelope"></i> {{ ownerEmail }}</p>
        </div>

        <button class="logout-btn" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i> Sign Out
        </button>
    </div>

    <div class="profile-content admin-card">
        <h2 class="text-gradient">Partner Profile</h2>
        <p class="subtitle">Manage your personal details and partner network locations.</p>

        <div class="glass-form" style="margin-top: 30px;">
            <h3>Contact Details</h3>
            <div class="form-group" style="max-width: 400px; margin-top: 15px;">
                <label>Operational Phone Number</label>
                <div style="display: flex; gap: 10px; align-items: center; justify-content: center;">
                  <input type="tel" [(ngModel)]="ownerPhone" placeholder="Enter mobile number" maxlength="10" style="flex: 1; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: #fff;">
                  <button class="add-btn" (click)="savePhone()" style="padding: 12px 20px;">Save Sync</button>
                </div>
            </div>
        </div>

        <div class="table-container" style="margin-top: 40px;" *ngIf="theatre().length > 0">
            <table class="vibe-table">
                <thead>
                    <tr>
                        <th>Theatre Block</th>
                        <th>Network Base Location</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let t of theatre()" class="table-row">
                        <td class="primary-text"><i class="bi bi-building"></i> {{ t.name }}</td>
                        <td>{{ t.location }}</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div *ngIf="theatre().length === 0" class="empty-state">
            <i class="bi bi-buildings"></i>
            <p>You have not registered any partner theatres yet.</p>
        </div>
    </div>
</div>
